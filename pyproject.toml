[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "zhuyin-converter"
description = "Pinyin <-> zhuyin (bopomofo) conversion, Taiwan conventions"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
authors = [{ name = "linlin56" }]
keywords = ["zhuyin", "bopomofo", "pinyin", "chinese", "mandarin"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Natural Language :: Chinese (Traditional)",
    "Topic :: Text Processing :: Linguistic",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/linlin56/zhuyin-converter"

[project.optional-dependencies]
test = ["pytest"]

[tool.maturin]
module-name = "zhuyin_converter"
features = ["python", "pyo3/extension-module"]
